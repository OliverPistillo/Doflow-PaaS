<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: https:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Starter Tema V2</title>
  <style>
    :root{--primary:#315c54;--dark:#13211e;--light:#f7faf8}*{box-sizing:border-box}body{margin:0;background:var(--light);color:var(--dark);font-family:system-ui,sans-serif}.header{position:fixed;inset:0 0 auto;z-index:2;padding:20px;color:#fff;transition:.25s}.header.scrolled{background:var(--light);color:var(--dark);box-shadow:0 5px 20px #0002}.logo{max-width:160px;max-height:48px}.header.scrolled .light,.header:not(.scrolled) .default{display:none}.hero{min-height:75vh;display:grid;place-items:center;padding:120px 24px 60px;background:linear-gradient(#10231dcc,#10231dcc),var(--hero) center/cover;color:#fff}.hero div{max-width:760px}.hero h1{font-size:clamp(2.6rem,7vw,5.8rem);line-height:1}.social{color:inherit}.section{max-width:960px;margin:auto;padding:80px 24px}@media(max-width:600px){.header{padding:14px}.section{padding:56px 18px}}
  </style>
</head>
<body>
  <header class="header" id="header"><img class="logo default" data-doflow-slot="brand.logoDefault" alt=""><img class="logo light" data-doflow-slot="brand.logoLight" alt=""><strong data-doflow-slot="brand.name"></strong><a class="social" data-doflow-slot="business.socialLinkedIn" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"></a></header>
  <main><section class="hero"><div><h1 data-doflow-slot="content.hero.title"></h1><p data-doflow-slot="content.hero.description"></p><img data-doflow-slot="images.hero" alt=""></div></section><section class="section"><h2>Contenuto del tema</h2><p>Estendere lo starter rispettando il contratto, i conteggi e gli slot obbligatori.</p></section></main>
  <script id="template-config" type="application/json">{"template":{"name":"Starter","slug":"starter","schemaVersion":"2.0","templateVersion":"2.0.0","layoutLocked":true},"editingContract":{"contractVersion":"2.0","protectedFields":["template","editingContract","textLimits"],"editableFields":["brand","business","content","images"],"fixedCounts":{"services":3,"trustItems":6,"faqs":6},"imageSlots":["logoDefault","logoLight","hero","consultation","feature"],"socialSlots":["socialLinkedIn","socialInstagram","socialFacebook"]},"brand":{"name":"Nome attività"},"business":{"socialLinkedIn":"","socialInstagram":"","socialFacebook":""},"images":{"logoDefault":{"src":"","alt":""},"logoLight":{"src":"","alt":""},"hero":{"src":"https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1800&q=82","alt":"Ambiente professionale"},"consultation":{"src":"https://images.unsplash.com/photo-1551836022-d5d88e9218df?auto=format&fit=crop&w=1200&q=82","alt":"Consulenza"},"feature":{"src":"https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=1200&q=82","alt":"Spazio"}},"content":{"hero":{"title":"Un titolo specifico","description":"Una descrizione prudente e concreta."},"services":[{},{},{}],"trustItems":[{},{},{},{},{},{}],"faq":[{},{},{},{},{},{}]},"textLimits":{"content.hero.title":100,"content.hero.description":300}}</script>
  <script>(()=>{'use strict';const c=JSON.parse(document.getElementById('template-config').textContent),all=(s)=>document.querySelectorAll(s),set=(slot,value)=>all(`[data-doflow-slot="${slot}"]`).forEach(n=>n.textContent=value||'');set('brand.name',c.brand.name);set('content.hero.title',c.content.hero.title);set('content.hero.description',c.content.hero.description);[['brand.logoDefault','logoDefault'],['brand.logoLight','logoLight'],['images.hero','hero']].forEach(([slot,key])=>all(`[data-doflow-slot="${slot}"]`).forEach(n=>{n.src=c.images[key].src;n.alt=c.images[key].alt;n.hidden=!n.src}));const social=document.querySelector('[data-doflow-slot="business.socialLinkedIn"]');social.href=c.business.socialLinkedIn;social.textContent=c.business.socialLinkedIn?'LinkedIn':'';social.hidden=!c.business.socialLinkedIn;const header=document.getElementById('header'),sync=()=>header.classList.toggle('scrolled',scrollY>40);addEventListener('scroll',sync,{passive:true});sync()})();</script>
</body>
</html>
