[package]
name = "doflow-desktop"
version = "1.1.0"
description = "Secure cloud-first Doflow Desktop shell"
authors = ["Doflow"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "doflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
atomic-write-file = "=0.3.1"
base64 = "=0.22.1"
rand = "=0.9.2"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "system-proxy"] }
semver = { version = "=1.0.28", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
subtle = "=2.6.1"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-notification = "=2.3.3"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-updater = "=2.10.1"
thiserror = "=2.0.17"
time = { version = "=0.3.47", features = ["formatting", "parsing"] }
tokio = { version = "=1.48.0", features = ["io-util", "macros", "net", "sync", "time"] }
url = "=2.5.7"
uuid = { version = "=1.26.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "=3.23.0"
