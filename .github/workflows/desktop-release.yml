name: Desktop validation and release

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "apps/frontend/src/lib/desktop-bridge.ts"
      - "apps/frontend/src/components/desktop/**"
      - "apps/frontend/src/components/auth/login-panel.tsx"
      - "apps/frontend/src/components/auth/register-panel.tsx"
      - "apps/frontend/src/components/auth/unified-auth-page.tsx"
      - "apps/frontend/src/app/[tenant]/mfa/page.tsx"
      - "apps/frontend/src/features/identity/doflow-identity-provider.tsx"
      - "apps/frontend/src/components/nav-user.tsx"
      - "apps/backend/src/auth/desktop-google-oauth.service.ts"
      - "apps/backend/src/auth/google-desktop.guard.ts"
      - "apps/backend/src/auth/google.controller.ts"
      - "apps/backend/src/auth/auth.module.ts"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:

concurrency:
  group: desktop-release-main
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Windows x64 Desktop
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out the triggering main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.6

      - name: Enable Corepack
        shell: pwsh
        run: corepack enable

      - name: Verify the repository pnpm version
        shell: pwsh
        run: pnpm --version

      - name: Install locked dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Select Windows x64 Rust target
        shell: pwsh
        run: rustup target add x86_64-pc-windows-msvc

      - name: Validate Desktop TypeScript
        shell: pwsh
        run: pnpm -C apps/desktop type-check

      - name: Run Desktop UI tests
        shell: pwsh
        run: pnpm -C apps/desktop test

      - name: Build Desktop Vite bundle
        shell: pwsh
        run: pnpm -C apps/desktop build

      - name: Validate Rust formatting
        shell: pwsh
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all -- --check

      - name: Run Rust Clippy
        shell: pwsh
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --target x86_64-pc-windows-msvc --all-targets -- -D warnings

      - name: Run Rust tests
        shell: pwsh
        working-directory: apps/desktop/src-tauri
        run: cargo test --target x86_64-pc-windows-msvc

      - name: Verify frontend Desktop contract still type-checks
        shell: pwsh
        run: pnpm -C apps/frontend type-check

      - name: Verify backend Desktop contract still builds
        shell: pwsh
        run: pnpm -C apps/backend build

  release-gate:
    name: Check explicit release enable gate
    needs: validate
    runs-on: windows-latest
    environment: desktop-release
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - id: gate
        name: Read environment release gate
        shell: pwsh
        env:
          DESKTOP_RELEASE_ENABLED: ${{ vars.DESKTOP_RELEASE_ENABLED }}
        run: |
          $enabled = "$env:DESKTOP_RELEASE_ENABLED".Trim().ToLowerInvariant() -eq "true"
          "enabled=$($enabled.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if (-not $enabled) { Write-Host "Desktop validation passed; public release is disabled." }

  release:
    name: Sign and publish Desktop update
    needs: [validate, release-gate]
    if: needs.release-gate.outputs.enabled == 'true' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: desktop-release
    permissions:
      contents: write
    steps:
      - name: Check out the exact triggering commit and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.6

      - name: Enable Corepack
        shell: pwsh
        run: corepack enable

      - name: Verify the repository pnpm version
        shell: pwsh
        run: pnpm --version

      - name: Install locked dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Validate signing configuration without printing it
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DOFLOW_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw "TAURI_SIGNING_PRIVATE_KEY is required" }
          if ([string]::IsNullOrWhiteSpace($env:DOFLOW_UPDATER_PUBLIC_KEY)) { throw "TAURI_SIGNING_PUBLIC_KEY is required" }
          try { $decoded = [Convert]::FromBase64String($env:DOFLOW_UPDATER_PUBLIC_KEY.Trim()) } catch { throw "TAURI_SIGNING_PUBLIC_KEY is not valid base64" }
          if ($decoded.Length -lt 32) { throw "TAURI_SIGNING_PUBLIC_KEY is invalid" }
          Write-Host "Updater signing configuration is present and structurally valid."

      - id: version
        name: Compute the next Desktop SemVer patch
        shell: pwsh
        run: node apps/desktop/scripts/next-desktop-version.mjs

      - name: Reject an existing or raced tag and prepare version override
        shell: pwsh
        env:
          DESKTOP_TAG: ${{ steps.version.outputs.tag }}
          DESKTOP_VERSION: ${{ steps.version.outputs.version }}
          DOFLOW_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          git fetch origin --tags --force
          if ($LASTEXITCODE -ne 0) { throw "unable to fetch Desktop release tags" }
          git rev-parse --verify --quiet "refs/tags/$env:DESKTOP_TAG"
          $tagLookupExitCode = $LASTEXITCODE
          if ($tagLookupExitCode -eq 0) { throw "Desktop tag already exists; refusing to overwrite it" }
          if ($tagLookupExitCode -ne 1) { throw "unable to verify whether the Desktop tag exists" }
          # Exit code 1 is the expected result when the release tag is absent.
          $global:LASTEXITCODE = 0
          @{
            version = $env:DESKTOP_VERSION
            plugins = @{
              updater = @{
                pubkey = $env:DOFLOW_UPDATER_PUBLIC_KEY
              }
            }
          } | ConvertTo-Json -Depth 4 -Compress | Out-File apps/desktop/src-tauri/tauri.ci.conf.json -Encoding utf8

      - name: Build signed installers and create a draft release
        id: tauri_release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DOFLOW_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
        with:
          projectPath: apps/desktop
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: Doflow Desktop ${{ steps.version.outputs.version }}
          releaseBody: Signed Doflow Desktop update for Windows x64.
          releaseDraft: true
          prerelease: false
          releaseCommitish: ${{ github.sha }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --target x86_64-pc-windows-msvc --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.ci.conf.json

      - name: Download and validate every draft release artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESKTOP_TAG: ${{ steps.version.outputs.tag }}
          DESKTOP_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_ID: ${{ steps.tauri_release.outputs.releaseId }}
        run: |
          $releaseId = 0L
          if (-not [long]::TryParse("$env:RELEASE_ID", [ref]$releaseId) -or $releaseId -le 0) { throw "tauri-action did not return a valid release ID" }
          gh api "repos/$env:GITHUB_REPOSITORY/releases/$releaseId" > desktop-release-metadata.json
          if ($LASTEXITCODE -ne 0) { throw "unable to download Desktop draft release metadata" }
          gh api "repos/$env:GITHUB_REPOSITORY/releases/$releaseId/assets?per_page=100" > desktop-release-assets-metadata.json
          if ($LASTEXITCODE -ne 0) { throw "unable to download Desktop draft asset metadata" }
          $releaseMetadata = Get-Content desktop-release-metadata.json -Raw | ConvertFrom-Json
          if ("$($releaseMetadata.id)" -ne "$releaseId") { throw "Desktop draft release ID mismatch" }
          if ($releaseMetadata.draft -ne $true) { throw "Desktop release is not a draft" }
          if ($releaseMetadata.prerelease -ne $false) { throw "Desktop release is unexpectedly a prerelease" }
          if ($releaseMetadata.tag_name -ne "$env:DESKTOP_TAG") { throw "Desktop draft tag name mismatch" }
          if ($releaseMetadata.target_commitish -ne "$env:GITHUB_SHA") { throw "Desktop draft does not target the triggering main SHA" }
          New-Item -ItemType Directory -Force -Path desktop-release-assets | Out-Null
          gh release download $env:DESKTOP_TAG --dir desktop-release-assets
          if ($LASTEXITCODE -ne 0) { throw "unable to download Desktop release artifacts" }
          node apps/desktop/scripts/validate-release-assets.mjs desktop-release-assets $env:DESKTOP_VERSION desktop-release-assets-metadata.json
          if ($LASTEXITCODE -ne 0) { throw "Desktop release artifact validation failed" }

      - name: Attach release policy and publish only the validated draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESKTOP_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $policy = Get-Content apps/desktop/release-policy.json -Raw | ConvertFrom-Json
          if ($policy.schemaVersion -ne 1 -or $policy.channel -ne "stable" -or -not $policy.minimumSupportedVersion) { throw "Desktop release policy is invalid" }
          Copy-Item apps/desktop/release-policy.json desktop-policy.json
          gh release upload $env:DESKTOP_TAG desktop-policy.json --clobber
          if ($LASTEXITCODE -ne 0) { throw "unable to upload the Desktop release policy" }
          gh release edit $env:DESKTOP_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "unable to publish the validated Desktop release" }

      - name: Verify published Desktop tag targets the triggering SHA
        shell: pwsh
        env:
          DESKTOP_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch origin "refs/tags/$env:DESKTOP_TAG:refs/tags/$env:DESKTOP_TAG"
          if ($LASTEXITCODE -ne 0) { throw "unable to fetch the published Desktop release tag" }
          $tagCommit = git rev-list -n 1 $env:DESKTOP_TAG
          if ($LASTEXITCODE -ne 0) { throw "unable to resolve the published Desktop release tag" }
          $tagCommit = "$tagCommit".Trim()
          if ($tagCommit -ne "$env:GITHUB_SHA") { throw "published Desktop release tag does not target the triggering main SHA" }
